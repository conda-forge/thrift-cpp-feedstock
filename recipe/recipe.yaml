context:
  version: "0.25.0"

recipe:
  name: thrift-split
  version: ${{ version }}

source:
  url: https://archive.apache.org/dist/thrift/${{ version }}/thrift-${{ version }}.tar.gz
  sha256: 66da4707214c54c94bac082103dc67adaf9e08925662700f269170a7b534b214
  patches:
    - if: win
      then:
        - patches/0001-windows-fixes.patch
        - patches/0002-Add-boost-throw_exception-implementation.patch

build:
  number: 0

outputs:
  - staging:
      name: thrift-build
    build:
      script:
        file: build
    requirements:
      build:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - pkg-config
        - if: win
          then: winflexbison
          else:
            - bison
            - flex
      host:
        - libboost-headers
        - libevent
        - openssl
        - zlib
      ignore_run_exports:
        from_package:
          - winflexbison

  - package:
      name: libthrift
    inherit: thrift-build
    build:
      script:
        file: install
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      build:
        # for strong run-exports
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - libboost-headers
        - libevent
        - openssl
        - zlib
    tests:
      - package_contents:
          include:
            - thrift/Thrift.h
          lib:
            - if: unix
              then:
                - thrift
                - thriftnb
                - thriftz
              else:
                - thriftmd
                - thriftnbmd
                - thriftzmd
          files:
            # absence of static libraries & binaries
            not_exists:
              - if: unix
                then:
                  - lib/libthrift.a
                  - lib/libthriftnb.a
                  - lib/libthriftz.a
                  - bin/thrift
                else:
                  - Library/bin/thrift.exe
      - requirements:
          run:
            # cmake needs compiler to be able to run package detection, see
            # https://discourse.cmake.org/t/questions-about-find-package-cli-msvc/6194
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
            - pkg-config
            # find_package(thrift) really wants to find zlib
            - if: linux or win
              then: zlib
        files:
          recipe:
            - cmake_test/
        script:
          # pkg-config metadata (different naming than DSOs; uses hyphen, no "lib" prefix)
          - pkg-config --print-errors --exact-version "${{ version }}" thrift
          - pkg-config --print-errors --exact-version "${{ version }}" thrift-nb
          - pkg-config --print-errors --exact-version "${{ version }}" thrift-z
          # test CMake integration, i.e. find_package(thrift)
          - cd cmake_test
          - if: win
            then: cmake -GNinja %CMAKE_ARGS% .
            else: cmake -GNinja $CMAKE_ARGS .
          - cmake --build .
          - ctest --output-on-failure

  - package:
      name: thrift-compiler
    inherit:
      from: thrift-build
      run_exports: false
    build:
      script:
        file: install
      files:
        - ${{ 'Library/bin/thrift.exe' if win else 'bin/thrift' }}
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      build:
        # for strong run-exports
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - ${{ pin_subpackage('libthrift', exact=true) }}
      run:
        - ${{ pin_subpackage('libthrift', exact=true) }}
    tests:
      - package_contents:
          files:
            - if: unix
              then: bin/thrift
              else: Library/bin/thrift.exe
      - script:
          - thrift --version

  - package:
      name: thrift-cpp
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      host:
        - ${{ pin_subpackage('libthrift', exact=true) }}
        - ${{ pin_subpackage('thrift-compiler', exact=true) }}
      run:
        - ${{ pin_subpackage('libthrift', exact=true) }}
        - ${{ pin_subpackage('thrift-compiler', exact=true) }}
    tests:
      - script: thrift --version

about:
  homepage: https://thrift.apache.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Compiler and C++ libraries and headers for the Apache Thrift RPC system
  repository: https://github.com/apache/thrift

extra:
  recipe-maintainers:
    - wesm
    - msarahan
    - jakirkham
    - xhochy
    - h-vetinari
  feedstock-name: thrift-cpp
