context:
  version: "0.25.0"

recipe:
  name: thrift-split
  version: ${{ version }}

source:
  url: https://archive.apache.org/dist/thrift/${{ version }}/thrift-${{ version }}.tar.gz
  sha256: 66da4707214c54c94bac082103dc67adaf9e08925662700f269170a7b534b214
  patches:
    - if: win
      then:
        - patches/0001-windows-fixes.patch
        - patches/0002-Add-boost-throw_exception-implementation.patch

build:
  number: 0

outputs:
  - staging:
      name: thrift-build
    build:
      script:
        file: ${{ 'build.bat' if win else 'build.sh' }}
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
        - pkg-config
        - if: win
          then: winflexbison
          else:
            - bison
            - flex
      host:
        - libboost-headers
        - libevent
        - openssl
        - zlib
      ignore_run_exports:
        from_package:
          - winflexbison

  - package:
      name: libthrift
    inherit: thrift-build
    build:
      script:
        file: ${{ 'install.bat' if win else 'install.sh' }}
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - libboost-headers
        - libevent
        - openssl
        - zlib
    tests:
      - script:
          - if: linux
            then:
              - test -f $PREFIX/lib/libthrift.so
              - test -f $PREFIX/lib/libthriftnb.so
              - test -f $PREFIX/lib/libthriftz.so
          - if: osx
            then:
              - test -f $PREFIX/lib/libthrift.dylib
              - test -f $PREFIX/lib/libthriftnb.dylib
              - test -f $PREFIX/lib/libthriftz.dylib
          - if: win
            then:
              - if not exist %LIBRARY_LIB%\thriftmd.lib exit 1
              - if not exist %LIBRARY_LIB%\thriftnbmd.lib exit 1
              - if not exist %LIBRARY_LIB%\thriftzmd.lib exit 1
              - if not exist %LIBRARY_BIN%\thriftmd.dll exit 1
              - if not exist %LIBRARY_BIN%\thriftnbmd.dll exit 1
              - if not exist %LIBRARY_BIN%\thriftzmd.dll exit 1
              - if exist %LIBRARY_BIN%\thrift.exe exit 1
              - if not exist %LIBRARY_INC%\thrift\Thrift.h exit 1
            else:
              - test ! -f $PREFIX/lib/libthrift.a
              - test ! -f $PREFIX/lib/libthriftnb.a
              - test ! -f $PREFIX/lib/libthriftz.a
              - test ! -f $PREFIX/bin/thrift
              - test -f $PREFIX/include/thrift/Thrift.h
          - pkg-config --print-errors --exact-version "${{ version }}" thrift
          - pkg-config --print-errors --exact-version "${{ version }}" thrift-nb
          - pkg-config --print-errors --exact-version "${{ version }}" thrift-z
          - cd cmake_test
          - if: win
            then: cmake -GNinja %CMAKE_ARGS% .
            else: cmake -GNinja $CMAKE_ARGS .
          - cmake --build .
          - ctest --output-on-failure
        files:
          recipe:
            - cmake_test/
        requirements:
          run:
            - ${{ compiler('cxx') }}
            - cmake
            - ninja
            - pkg-config
            - if: linux or win
              then: zlib

  - package:
      name: thrift-compiler
    inherit:
      from: thrift-build
      run_exports: false
    build:
      script:
        file: ${{ 'install.bat' if win else 'install.sh' }}
      files:
        - ${{ 'Library/bin/thrift.exe' if win else 'bin/thrift' }}
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      build:
        - ${{ compiler('c') }}
        - ${{ stdlib('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - ${{ pin_subpackage('libthrift', exact=true) }}
      run:
        - ${{ pin_subpackage('libthrift', exact=true) }}
    tests:
      - script:
          - if: win
            then: if not exist %LIBRARY_BIN%\thrift.exe exit 1
            else: test -f $PREFIX/bin/thrift
          - thrift --version

  - package:
      name: thrift-cpp
    requirements:
      run_exports:
        - ${{ pin_subpackage('libthrift', upper_bound='x.x.x') }}
      host:
        - ${{ pin_subpackage('libthrift', exact=true) }}
        - ${{ pin_subpackage('thrift-compiler', exact=true) }}
      run:
        - ${{ pin_subpackage('libthrift', exact=true) }}
        - ${{ pin_subpackage('thrift-compiler', exact=true) }}
    tests:
      - script: thrift --version

about:
  homepage: https://thrift.apache.org
  license: Apache-2.0
  license_file: LICENSE
  summary: Compiler and C++ libraries and headers for the Apache Thrift RPC system
  repository: https://github.com/apache/thrift

extra:
  recipe-maintainers:
    - wesm
    - msarahan
    - jakirkham
    - xhochy
    - h-vetinari
  feedstock-name: thrift-cpp
